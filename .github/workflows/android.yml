
name: Build Padium APK

'on':
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

          MANAGER=$(find "$SDK/cmdline-tools" \
            -type f -name sdkmanager \
            2>/dev/null | head -n 1)

          if [ -z "$MANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi

          echo "Using $MANAGER"

          "$MANAGER" --sdk_root="$SDK" \
            --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Padium APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Padium-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
